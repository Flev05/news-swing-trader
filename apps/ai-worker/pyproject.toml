[project]
name = "news-swing-ai-worker"
version = "0.0.1"
description = "Local worker scaffold with Milestone 1 shared-contract validation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema[format-nongpl]==4.26.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
    "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
news-swing-ai-worker = "news_swing_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "news_swing_ai"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
